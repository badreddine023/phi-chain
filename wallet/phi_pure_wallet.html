<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Φ-Chain Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .golden-spiral {
            background: radial-gradient(circle at 0% 0%, transparent 0%, transparent 50%, #22d3ee 50%, #22d3ee 51%, transparent 51%);
            background-size: 200% 200%;
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #log::-webkit-scrollbar { width: 4px; }
        #log::-webkit-scrollbar-thumb { background: #164e63; border-radius: 10px; }
    </style>
</head>
<body class="bg-black text-cyan-50 font-mono">
    <div class="container mx-auto p-8 max-w-4xl">
        <header class="border-b border-cyan-900 pb-6 mb-12 flex justify-between items-end">
            <div>
                <h1 class="text-6xl font-bold text-cyan-400 tracking-tighter">PURE Φ</h1>
                <p class="text-cyan-700 mt-2">Integer-Only Fibonacci Blockchain</p>
            </div>
            <div class="text-right">
                <div class="text-xs text-cyan-800">NETWORK STATUS</div>
                <div id="status" class="text-yellow-500 font-bold">CONNECTING...</div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
            <!-- Balance Card -->
            <div class="col-span-2 bg-slate-950 border border-cyan-900 p-8 rounded-2xl relative overflow-hidden">
                <div class="relative z-10">
                    <h2 class="text-cyan-700 text-sm mb-4">AVAILABLE BALANCE</h2>
                    <div class="flex items-baseline gap-4">
                        <span id="balance" class="text-7xl font-bold text-white">0</span>
                        <span class="text-3xl text-cyan-400">Φ</span>
                    </div>
                    <div id="fib-info" class="mt-4 text-cyan-800 text-xs">Synchronizing with Fibonacci sequence...</div>
                </div>
                <div class="absolute top-0 right-0 w-64 h-64 golden-spiral opacity-10"></div>
            </div>

            <!-- Address Card -->
            <div class="bg-slate-950 border border-cyan-900 p-8 rounded-2xl">
                <h2 class="text-cyan-700 text-sm mb-4">YOUR PHI ADDRESS</h2>
                <div id="address" class="bg-black p-4 border border-cyan-950 rounded text-[10px] break-all text-cyan-300 leading-relaxed">
                    PHI[A4F2-89BC-11D4-E902][C8A1][F032]
                </div>
                <button onclick="copyAddress()" class="mt-4 w-full py-2 text-xs border border-cyan-800 hover:bg-cyan-950 transition">COPY ADDRESS</button>
            </div>
        </div>

        <!-- Transaction Section -->
        <div class="bg-slate-950 border border-cyan-900 p-8 rounded-2xl mb-12">
            <h2 class="text-xl font-bold mb-8 border-l-4 border-cyan-500 pl-4">SEND HARMONIOUS TRANSACTION</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <label class="block text-xs text-cyan-700 mb-2">RECIPIENT PHI ADDRESS</label>
                    <input id="recipient" type="text" placeholder="PHI[....-....-....-....][....][....]" class="w-full bg-black border border-cyan-900 p-4 rounded focus:outline-none focus:border-cyan-400 text-sm">
                </div>
                <div>
                    <label class="block text-xs text-cyan-700 mb-2">AMOUNT (MUST BE FIBONACCI)</label>
                    <div class="flex gap-2">
                        <input id="amount" type="number" placeholder="e.g. 55, 89, 144" class="w-full bg-black border border-cyan-900 p-4 rounded focus:outline-none focus:border-cyan-400 text-sm">
                        <button onclick="sendTransaction()" class="bg-cyan-600 hover:bg-cyan-500 text-black font-bold px-8 rounded transition">SEND</button>
                    </div>
                </div>
            </div>
            <div class="mt-4 flex gap-2 overflow-x-auto pb-2">
                <span class="text-[10px] text-cyan-900 uppercase">Quick Fib:</span>
                <button onclick="setAmount(21)" class="text-[10px] px-2 py-1 border border-cyan-900 hover:border-cyan-500">21</button>
                <button onclick="setAmount(34)" class="text-[10px] px-2 py-1 border border-cyan-900 hover:border-cyan-500">34</button>
                <button onclick="setAmount(55)" class="text-[10px] px-2 py-1 border border-cyan-900 hover:border-cyan-500">55</button>
                <button onclick="setAmount(89)" class="text-[10px] px-2 py-1 border border-cyan-900 hover:border-cyan-500">89</button>
                <button onclick="setAmount(144)" class="text-[10px] px-2 py-1 border border-cyan-900 hover:border-cyan-500">144</button>
                <button onclick="setAmount(233)" class="text-[10px] px-2 py-1 border border-cyan-900 hover:border-cyan-500">233</button>
            </div>
        </div>

        <!-- Activity Log -->
        <div class="bg-black border border-cyan-950 p-6 rounded-xl">
            <h3 class="text-xs text-cyan-800 mb-4">PHI-CHAIN LIVE HARMONY LOG</h3>
            <div id="log" class="space-y-2 text-[10px] font-mono max-h-48 overflow-y-auto flex flex-col-reverse">
                <div class="flex gap-4"><span class="text-cyan-900">[SYSTEM]</span> <span class="text-cyan-600">INITIALIZING HARMONY...</span></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "8000-isrdav1st12yk4fx43sw3-ab52b16b.us2.manus.computer";
        const API_URL = `https://${API_BASE}`;
        const WS_URL = `wss://${API_BASE}/ws`;
        
        let socket;
        const logContainer = document.getElementById('log');
        const statusEl = document.getElementById('status');

        function addLog(message, colorClass = 'text-cyan-700') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = 'flex gap-4 fade-in';
            div.innerHTML = `<span class="text-cyan-900">[${time}]</span> <span class="${colorClass}">${message}</span>`;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function connectWS() {
            socket = new WebSocket(WS_URL);
            
            socket.onopen = () => {
                statusEl.innerText = 'HARMONIOUS';
                statusEl.className = 'text-green-500 font-bold';
                addLog('CONNECTED TO Φ-CHAIN NETWORK', 'text-green-500');
            };

            socket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'NEW_BLOCK') {
                    addLog(`BLOCK #${msg.data.index} VALIDATED | HASH: ${msg.data.hash.substring(0, 16)}...`, 'text-green-900');
                    updateBalance();
                } else if (msg.type === 'NEW_TRANSACTION') {
                    addLog(`TX: ${msg.data.sender.substring(0, 8)}... -> ${msg.data.recipient.substring(0, 8)}... | AMOUNT: ${msg.data.amount} Φ`, 'text-cyan-600');
                }
            };

            socket.onclose = () => {
                statusEl.innerText = 'DISCONNECTED';
                statusEl.className = 'text-red-500 font-bold';
                addLog('CONNECTION LOST. RECONNECTING...', 'text-red-500');
                setTimeout(connectWS, 3000);
            };
        }

        async function updateBalance() {
            try {
                const addr = document.getElementById('address').innerText.trim();
                const res = await fetch(`${API_URL}/balance/${encodeURIComponent(addr)}`);
                const data = await res.json();
                document.getElementById('balance').innerText = data.balance.toLocaleString();
                document.getElementById('fib-info').innerText = `≈ F(${Math.round(Math.log(data.balance * Math.sqrt(5) + 0.5) / Math.log(1.61803398875))}) Fibonacci Units`;
            } catch (e) {
                console.error("Failed to update balance", e);
            }
        }

        async function sendTransaction() {
            const recipient = document.getElementById('recipient').value;
            const amount = parseInt(document.getElementById('amount').value);
            const sender = document.getElementById('address').innerText.trim();

            if (!recipient || !amount) return alert("Please fill all fields");

            try {
                const res = await fetch(`${API_URL}/transactions/new`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender, recipient, amount })
                });
                
                const data = await res.json();
                if (res.ok) {
                    addLog(`TRANSACTION BROADCASTED: ${amount} Φ`, 'text-yellow-500');
                    document.getElementById('amount').value = '';
                    document.getElementById('recipient').value = '';
                } else {
                    alert(data.detail || "Transaction failed");
                }
            } catch (e) {
                alert("Network error: " + e.message);
            }
        }

        function setAmount(val) {
            document.getElementById('amount').value = val;
        }

        function copyAddress() {
            const addr = document.getElementById('address').innerText;
            navigator.clipboard.writeText(addr);
            addLog('ADDRESS COPIED TO CLIPBOARD', 'text-cyan-400');
        }

        // Initialisation
        connectWS();
        updateBalance();
    </script>
</body>
</html>
